apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-socket-cluster
  namespace: production
  labels:
    app: mern-socket-cluster
    tier: realtime
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mern-socket-cluster
  template:
    metadata:
      labels:
        app: mern-socket-cluster
    spec:
      containers:
        - name: socket-node
          image: mern-ai-chat-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              value: "redis://mern-redis-cluster:6379"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mern-secrets
                  key: mongo-uri
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mern-socket-service
  namespace: production
spec:
  selector:
    app: mern-socket-cluster
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  sessionAffinity: ClientIP
