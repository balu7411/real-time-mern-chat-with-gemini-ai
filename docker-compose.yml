version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mern-ai-chat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: mern-ai-chat-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/mern-ai-chat
      - JWT_SECRET=${JWT_SECRET:-change_this_secret}
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: mern-ai-chat-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo-data:
